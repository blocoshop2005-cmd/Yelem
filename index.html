<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yelen — Ouvre ta boutique, vends dès ce soir</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f2f4fa;--surf:#fff;--ink:#171b3a;--mute:#5d6385;--line:#dfe3f1;--acc:#2f3bd6;--sun:#ffb81c;--sunink:#3a2800;--ok:#12805c;--shop:#2f3bd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1226;--surf:#191d3a;--ink:#eef0fb;--mute:#a3a9cf;--line:#2a2f57;--acc:#8e97ff;--ok:#4fd1a0}}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;line-height:1.1;margin:0;letter-spacing:-.02em}
a{color:inherit}:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.logo{font:800 1.5rem "Bricolage Grotesque",sans-serif;text-decoration:none;display:flex;gap:8px;align-items:center}
.logo i{width:22px;height:22px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 5px color-mix(in srgb,var(--sun) 28%,transparent)}
nav a{margin-left:18px;text-decoration:none;font-weight:500;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;border:2px solid transparent;font:700 1rem "DM Sans",sans-serif;cursor:pointer;text-decoration:none;background:var(--acc);color:#fff}
.btn.sun{background:var(--sun);color:var(--sunink)}.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem}.btn.danger{background:transparent;color:#c0332b;border-color:var(--line)}
.btn[disabled]{opacity:.55;cursor:wait}
input,select,textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
label{font-weight:700;font-size:.92rem;display:block;margin:14px 0 6px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:36px 0 56px}
.hero h1{font-size:clamp(2.3rem,5.4vw,4rem);font-weight:800}
.lead{font-size:1.15rem;color:var(--mute);max-width:46ch;margin:18px 0 24px}
.go{display:flex;gap:10px;max-width:480px}.go input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;color:var(--mute);font-size:.92rem}
.chips span{padding:4px 12px;border:1px solid var(--line);border-radius:99px}
.sec{padding:50px 0}.sec h2{font-size:clamp(1.7rem,3.6vw,2.5rem);max-width:20ch;margin-bottom:26px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:22px}
.card h3{font-size:1.25rem;margin-bottom:8px}.card p{margin:0;color:var(--mute)}
.band{background:var(--ink);color:#fff;border-radius:28px;padding:40px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (prefers-color-scheme:dark){.band{background:var(--surf)}}
.band h2{margin:0;color:#fff}.band p{color:#c9cdee;margin:0 0 10px}
.price{display:flex;align-items:baseline;gap:6px;font:800 2rem "Bricolage Grotesque",sans-serif;margin:8px 0}.price small{font:500 .9rem "DM Sans";color:var(--mute)}
.card ul{padding-left:18px;margin:10px 0 18px;color:var(--mute)}.card.pop{border:2px solid var(--sun)}
.build{display:grid;grid-template-columns:1fr 340px;gap:36px;padding:20px 0 60px;align-items:start}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:24px}
.cats,.sw{display:flex;flex-wrap:wrap;gap:8px}
.cat{min-height:40px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:transparent;color:var(--ink);font:500 .95rem "DM Sans";cursor:pointer}
.cat[aria-pressed=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);font-weight:700}
.dot{width:38px;height:38px;border-radius:50%;border:3px solid var(--surf);box-shadow:0 0 0 2px var(--line);cursor:pointer;background:var(--c)}.dot[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.phone{width:300px;margin:0 auto;border:9px solid #171b3a;border-radius:38px;overflow:hidden;background:#fff;color:#171b3a;position:sticky;top:20px}
.phone .shopv{height:520px;overflow:auto}
.sv-head{background:var(--shop);color:#fff;padding:18px 16px}.sv-head b{font:800 1.3rem "Bricolage Grotesque",sans-serif;display:block}.sv-head span{opacity:.85;font-size:.85rem}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.pc{border:1px solid #e3e6f3;border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column;color:#171b3a}
.pc .im{aspect-ratio:1;display:grid;place-items:center;font-size:2.6rem;background:color-mix(in srgb,var(--shop) 12%,#fff);cursor:pointer}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc div.t{padding:8px 10px;font-size:.92rem}.pc .t b{display:block}.pc .t em{font-style:normal;color:var(--shop);font-weight:700}
.pc button.add{margin:0 10px 10px;min-height:38px;border:0;border-radius:10px;background:var(--shop);color:#fff;font:700 .85rem "DM Sans";cursor:pointer}
.store{background:#fff;color:#171b3a;min-height:100vh}.store .inner{max-width:960px;margin:0 auto;padding:0 20px}
.ann{background:#171b3a;color:#fff;text-align:center;padding:8px;font-size:.88rem}
.store .sv-head{padding:26px 0}.store .sv-head b{font-size:2rem}
.hero2{background:color-mix(in srgb,var(--shop) 10%,#fff);padding:44px 0}
.hero2 h2{font-size:clamp(1.8rem,4.5vw,3rem);max-width:18ch}.hero2 p{max-width:48ch;color:#4a5072;margin:14px 0 22px}
.hero2 .btn{background:var(--shop);color:#fff}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:26px 0}
.trust div{padding:14px 16px;border:1px solid #e3e6f3;border-radius:14px;font-size:.92rem}.trust b{display:block}
.store h3.sh{font-size:1.6rem;margin:26px 0 4px}
.store .pg{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));padding:14px 0}
.welcome{border:2px dashed color-mix(in srgb,var(--shop) 45%,#fff);border-radius:20px;padding:28px;margin:14px 0;background:color-mix(in srgb,var(--shop) 5%,#fff)}
.welcome h3{font-size:1.5rem;margin-bottom:8px}.welcome p{margin:0 0 10px;color:#4a5072}
.about{padding:26px 0;color:#3d4366;max-width:62ch}
.foot{background:#171b3a;color:#c9cdee;padding:28px 0;margin-top:30px}
.t-chic h2,.t-chic h3,.t-chic .sv-head b{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:0}
.t-chic .pc,.t-chic .trust div,.t-chic .welcome{border-radius:2px}.t-chic .btn,.t-chic .pc button.add{border-radius:2px}
.t-chic .sv-head{background:#171b3a}.t-chic .hero2{background:#f6f3ee}
.t-marche .sv-head{background:var(--shop);border-bottom:6px solid var(--sun)}.t-marche .hero2{background:var(--sun);color:#3a2800}.t-marche .hero2 p{color:#3a2800}.t-marche .hero2 .btn{background:#171b3a}
.cart{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--shop);color:#fff;border:0;border-radius:99px;padding:14px 22px;font:700 1rem "DM Sans";cursor:pointer;box-shadow:0 8px 24px #0004;z-index:5}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:9}
.modal .panel{max-width:460px;width:100%;max-height:90vh;overflow:auto;background:#fff;color:#171b3a;border-color:#e3e6f3}
.modal input,.modal select{background:#fff;color:#171b3a;border-color:#dfe3f1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.stat{padding:18px;border-radius:16px;background:var(--surf);border:1px solid var(--line)}
.stat b{font:800 1.7rem "Bricolage Grotesque",sans-serif;display:block}.stat span{color:var(--mute);font-size:.9rem}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:16px}
.tab{padding:10px 16px;border:0;background:none;color:var(--mute);font:700 .95rem "DM Sans";cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--sun)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;margin-top:18px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.th{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--line);display:grid;place-items:center;flex:none}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:color-mix(in srgb,var(--sun) 30%,transparent)}
.tag.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.empty{color:var(--mute);padding:14px 0}.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0 12px}.bar i{display:block;height:100%;background:var(--ok)}
.studio{display:grid;grid-template-columns:240px 1fr;gap:20px}.drop{aspect-ratio:1;border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;text-align:center;color:var(--mute);overflow:hidden;background:var(--bg)}
.drop img{width:100%;height:100%;object-fit:cover}.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.themes button{padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer;text-align:left;font:inherit}.themes button[aria-pressed=true]{border-color:var(--acc)}
.sw2{display:flex;align-items:center;gap:10px;margin-top:14px}.sw2 input{width:20px;min-height:20px}.sw2 label{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;z-index:20}
.sr{position:absolute;left:-9999px}
@media (max-width:820px){.hero,.build,.two,.band,.studio{grid-template-columns:1fr}.phone{position:static}nav a.h{display:none}.band{padding:26px}.themes{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var CATS=[["Mode","👗"],["Beauté","💄"],["Alimentation","🍯"],["Électronique","🎧"],["Maison","🪴"],["Bijoux","💍"],["Services","🛠️"],["Autre","🛍️"]];
var COLS=[["Indigo","#2f3bd6"],["Safran","#d98c00"],["Émeraude","#0d8a63"],["Grenade","#c4234f"],["Ardoise","#26304d"],["Violet","#7a35c9"]];
var CURS=[["XOF","F CFA"],["EUR","€"],["USD","$"],["GHS","GH₵"],["MAD","MAD"]];
var SAMPLE={Mode:[["Robe en wax",18500],["Sac tressé",12000]],Beauté:[["Beurre de karité",3500],["Sérum visage",7500]],Alimentation:[["Miel naturel",4500],["Jus de bissap",1500]],"Électronique":[["Écouteurs",15000],["Chargeur rapide",5000]],Maison:[["Coussin",6500],["Bougie",5000]],Bijoux:[["Collier",12000],["Bracelet",8000]],Services:[["Diagnostic",5000],["Installation",20000]],Autre:[["Produit vedette",10000],["Nouveauté",7500]]};
var S=load(),cart=[],tab="dash",draft={name:"",cat:"Mode",color:"#2f3bd6",cur:"XOF"},pd={raw:null,blob:null,img:null,busy:false};
function load(){try{return JSON.parse(localStorage.getItem("yelen2")||"null")}catch(e){return null}}
function save(){try{localStorage.setItem("yelen2",JSON.stringify(S))}catch(e){toast("Stockage plein : supprime une photo.")}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n,c){var u=(CURS.find(function(x){return x[0]===c})||[0,c])[1];return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ")+" "+u}
function icon(cat){return(CATS.find(function(c){return c[0]===cat})||[0,"🛍️"])[1]}
function slug(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"ma-boutique"}
function toast(t){var d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},3000)}
function $(i){return document.getElementById(i)}
function header(){return '<header class="top wrap"><a class="logo" href="#accueil"><i></i>Yelen</a><nav><a class="h" href="#offres">Offres</a>'+(S?'<a href="#gestion">Mon espace</a>':'')+'<a href="#'+(S?"vitrine":"creer")+'" class="btn sun sm" style="color:var(--sunink)">'+(S?"Ma vitrine":"Créer ma boutique")+'</a></nav></header>'}
function newShop(){var s=SAMPLE[draft.cat].map(function(p){return{name:p[0],price:p[1],desc:""}});return{name:draft.name,cat:draft.cat,color:draft.color,cur:draft.cur,theme:"classique",announce:"Livraison rapide · Paiement sécurisé",hero:{title:"Bienvenue chez "+draft.name,sub:"Des produits choisis avec soin, livrés jusqu’à ta porte. Commande en quelques clics."},about:"Nous sommes une petite équipe passionnée. Chaque commande est préparée avec attention et suivie jusqu’à la livraison. Une question ? Écris-nous, on répond vite.",wa:"",fee:0,pay:{cod:true,momo:true},products:s,orders:[],views:0,demo:false}}
function pcards(sh,btn){return sh.products.map(function(p,i){return '<div class="pc"><div class="im" '+(btn?'data-act="view" data-i="'+i+'" role="button" tabindex="0" aria-label="Voir '+esc(p.name)+'"':'aria-hidden="true"')+'>'+(p.img?'<img src="'+p.img+'" alt="'+esc(p.name)+'">':icon(sh.cat))+'</div><div class="t"><b>'+esc(p.name)+'</b><em>'+money(p.price,sh.cur)+'</em></div>'+(btn?'<button class="add" data-act="add" data-i="'+i+'">Ajouter au panier</button>':'')+'</div>'}).join("")}
function home(){var demo={cat:"Mode",cur:"XOF",products:[{name:"Robe en wax",price:18500},{name:"Sac tressé",price:12000},{name:"Boubou brodé",price:25000},{name:"Sandales",price:9500}]};return header()+'<main class="wrap"><section class="hero"><div><h1>Ta boutique ouverte ce soir, pas dans trois semaines.</h1><p class="lead">Prends ton produit en photo : l’IA le détoure, le met en scène et écrit sa fiche. Tes clients commandent seuls, tu livres.</p><form class="go" data-form="start"><label class="sr" for="n0">Nom de ta boutique</label><input id="n0" name="n" placeholder="Nom de ta boutique" maxlength="40" autocomplete="organization"><button class="btn sun" type="submit">Commencer</button></form><div class="chips"><span>Gratuit pour démarrer</span><span>Photos pro par IA</span><span>Paiement à la livraison ou Mobile Money</span></div></div><div class="phone" aria-hidden="true"><div class="shopv" style="--shop:#2f3bd6"><div class="sv-head"><b>Atelier Kadi</b><span>Mode · Ouagadougou</span></div><div class="pg">'+pcards(demo,false)+'</div></div></div></section><section class="sec"><h2>Moins de messages, plus de ventes</h2><div class="grid3"><div class="card"><h3>Photos de studio en un geste</h3><p>Une photo prise au téléphone devient une image nette, sur fond propre.</p></div><div class="card"><h3>Fiches rédigées pour toi</h3><p>Titre, description et mots-clés proposés par l’IA, que tu ajustes si tu veux.</p></div><div class="card"><h3>Un espace de pilotage</h3><p>Ventes, commandes, apparence et réglages au même endroit.</p></div></div></section><section class="sec" id="offres"><h2>Des offres qui suivent ta croissance</h2><div class="grid3"><div class="card"><h3>Départ</h3><div class="price">0<small>pour toujours</small></div><ul><li>10 produits</li><li>Paiement à la livraison</li><li>Vitrine partageable</li></ul><a class="btn ghost" href="#creer">Commencer</a></div><div class="card pop"><h3>Croissance</h3><div class="price">8 €<small>/ mois</small></div><ul><li>Produits illimités</li><li>Mobile Money et carte</li><li>Assistant IA inclus</li></ul><a class="btn sun" href="#creer">Essayer 14 jours</a></div><div class="card"><h3>Équipe</h3><div class="price">25 €<small>/ mois</small></div><ul><li>Plusieurs boutiques</li><li>Collaborateurs</li><li>Support prioritaire</li></ul><a class="btn ghost" href="#creer">Choisir</a></div></div></section></main><footer class="wrap" style="padding:30px 0;color:var(--mute)">© 2026 Yelen · Prototype</footer>'}
function prev(){var d=draft,sh={cat:d.cat,cur:d.cur,products:SAMPLE[d.cat].map(function(p){return{name:p[0],price:p[1]}})};return '<div class="sv-head"><b>'+esc(d.name||"Ta boutique")+'</b><span>'+d.cat+'</span></div><div class="pg">'+pcards(sh,false)+'</div>'}
function creer(){var d=draft;return header()+'<main class="wrap"><div class="build"><section class="panel"><h2 style="font-size:2rem">Crée ta boutique</h2><form data-form="create"><label for="nm">Nom de ta boutique</label><input id="nm" name="nm" value="'+esc(d.name)+'" maxlength="40" required placeholder="Ex. Atelier Kadi"><label id="l1">Que vends-tu ?</label><div class="cats" role="group" aria-labelledby="l1">'+CATS.map(function(c){return '<button type="button" class="cat" data-act="cat" data-v="'+c[0]+'" aria-pressed="'+(d.cat===c[0])+'">'+c[1]+" "+c[0]+'</button>'}).join("")+'</div><label id="l2">Ta couleur</label><div class="sw" role="group" aria-labelledby="l2">'+COLS.map(function(c){return '<button type="button" class="dot" style="--c:'+c[1]+'" data-act="col" data-v="'+c[1]+'" aria-label="'+c[0]+'" aria-pressed="'+(d.color===c[1])+'"></button>'}).join("")+'</div><label for="cu">Devise</label><select id="cu" data-act="cur">'+CURS.map(function(c){return '<option value="'+c[0]+'"'+(d.cur===c[0]?" selected":"")+'>'+c[0]+' · '+c[1]+'</option>'}).join("")+'</select><p style="margin:12px 0;color:var(--mute)">Ton lien : <b>yelen.app/'+esc(slug(d.name))+'</b></p><button class="btn sun" style="width:100%" type="submit">Ouvrir ma boutique</button></form></section><div class="phone" aria-label="Aperçu de ta boutique"><div class="shopv" id="prev" style="--shop:'+d.color+'">'+prev()+'</div></div></div></main>'}
function series(){var out=[],now=new Date();for(var i=6;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i),k=d.toDateString(),v=0;S.orders.forEach(function(o){if(o.status!=="Annulée"&&new Date(o.at||0).toDateString()===k)v+=o.total});out.push({l:["D","L","M","M","J","V","S"][d.getDay()],v:v})}if(S.demo){var m=[12,18,15,26,31,29,42];out.forEach(function(o,i){o.v=m[i]*1000})}return out}
function chart(){var s=series(),mx=Math.max.apply(null,s.map(function(o){return o.v}))||1;return '<svg viewBox="0 0 420 160" role="img" aria-label="Ventes des 7 derniers jours" style="width:100%;height:auto">'+s.map(function(o,i){var h=Math.max(3,o.v/mx*115),x=14+i*58;return '<rect x="'+x+'" y="'+(130-h)+'" width="40" height="'+h+'" rx="8" fill="'+(i===6?"var(--sun)":"var(--acc)")+'" opacity="'+(o.v?1:.25)+'"/><text x="'+(x+20)+'" y="150" text-anchor="middle" font-size="12" fill="var(--mute)">'+o.l+'</text>'}).join("")+'</svg>'}

document.addEventListener("change",function(e){var t=e.target;
if(t.dataset.act==="cur"){draft.cur=t.value}
else if(t.id==="ph"&&t.files[0]){readImg(t.files[0]).then(function(r){pd.raw=r.raw;pd.blob=r.blob;pd.img=null;$("drop").innerHTML='<img src="'+r.raw+'" alt="Photo">'}).catch(function(){toast("Image illisible.")})}
else if(t.dataset.k&&S){var p=t.dataset.k.split("."),o=S;while(p.length>1)o=o[p.shift()];o[p[0]]=t.type==="checkbox"?t.checked:t.type==="number"?+t.value:t.value;save();toast("Enregistré");if(t.dataset.k==="cur"||t.dataset.k==="name")route()}});
document.addEventListener("input",function(e){if(e.target.id==="nm"){draft.name=e.target.value;refreshPrev()}});
document.addEventListener("submit",function(e){e.preventDefault();var f=e.target,k=f.dataset.form,v=new FormData(f);
if(k==="start"){draft.name=(v.get("n")||"").trim();location.hash="#creer"}
else if(k==="create"){draft.name=(v.get("nm")||"").trim();if(!draft.name)return;S=newShop();save();tab="dash";location.hash="#gestion";toast("Boutique ouverte")}
else if(k==="order"){var f2=+S.fee||0,tot=cart.reduce(function(a,p){return a+p.price},0)+f2,o={client:v.get("c"),phone:v.get("t"),pay:v.get("p"),items:cart.map(function(p){return p.name}),total:tot,status:"Nouvelle",at:Date.now()};S.orders.unshift(o);save();cart=[];route();toast("Commande envoyée. Le vendeur te contacte.");
if(S.wa){var m="Bonjour, nouvelle commande de "+o.client+" : "+o.items.join(", ")+" — "+money(o.total,S.cur);window.open("https://wa.me/"+S.wa.replace(/\D/g,"")+"?text="+encodeURIComponent(m),"_blank","noopener")}}});
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
